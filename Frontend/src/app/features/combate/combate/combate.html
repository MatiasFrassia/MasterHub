<section class="mesa-combate">
  <div class="buscador-seccion">
    <app-buscador-criaturas (criaturaSeleccionada)="agregarACombate($event)"></app-buscador-criaturas>
  </div>

  <h3>Combatientes Activos ({{ combatientesActivos.length }})</h3>
  
  <div class="grilla-combatientes">
  @for (c of combatientesActivos; track c.id) {
    <app-tarjeta-basica [criatura]="c"></app-tarjeta-basica>
  } @empty {
    <p>No hay combatientes activos.</p>
  }
</div>
</section>
